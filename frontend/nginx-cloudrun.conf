server {
    # Listen on the port Cloud Run provides, usually 8080
    listen 8080;
    
    # Placeholder for the internal backend URL, which will be substituted at runtime
    # The Cloud Run deployment will set an environment variable named INTERNAL_API_URL
    set $api_url "${INTERNAL_API_URL}";

    # Rewrite your index.html file to dynamically include the API URL
    location / {
        root /usr/share/nginx/html;
        index index.html;
        
        # Crucial for Single Page App routing: if a file isn't found, fall back to index.html
        try_files $uri $uri/ /index.html;
    }
}