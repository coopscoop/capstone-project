services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: Capstone
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/Capstone.Infrastructure/Persistence/Migrations/Users.sql:/docker-entrypoint-initdb.d/01-Users.sql
      - ./backend/Capstone.Infrastructure/Persistence/Migrations/Posts.sql:/docker-entrypoint-initdb.d/02-Posts.sql
      - ./backend/Capstone.Infrastructure/Persistence/Migrations/Tags.sql:/docker-entrypoint-initdb.d/03-Tags.sql
      - ./backend/Capstone.Infrastructure/Persistence/Migrations/RefreshToken.sql:/docker-entrypoint-initdb.d/04-RefreshToken.sql
      - ./backend/Capstone.Infrastructure/Persistence/Migrations/PasswordReset.sql:/docker-entrypoint-initdb.d/05-PasswordReset.sql
      - ./backend/Capstone.Infrastructure/Persistence/Migrations/Favourites.sql:/docker-entrypoint-initdb.d/06-Favourites.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=Capstone;Username=postgres;Password=postgres"
      ASPNETCORE_ENVIRONMENT: Development
      Python__ScriptPath: "Python/python_worker.py"
      ASPNETCORE_URLS: "http://+:5225"
    ports:
      - "5225:5225"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5225/api
    environment:
      PORT: 8080
    ports:
      - "3000:8080"
    depends_on:
      - backend

volumes:
  postgres_data: